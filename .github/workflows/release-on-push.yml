name: Create a new version on every push

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize releases so each push increments the version produced by the previous run.
concurrency:
  group: constellation-3d-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump patch version
        id: version
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("manifest.json")
          manifest = json.loads(manifest_path.read_text())
          version = manifest["version"]
          major, minor, patch = (int(part) for part in version.split("."))
          next_version = f"{major}.{minor}.{patch + 1}"
          manifest["version"] = next_version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          versions_path = Path("versions.json")
          versions = json.loads(versions_path.read_text()) if versions_path.exists() else {}
          versions[next_version] = manifest["minAppVersion"]
          versions_path.write_text(json.dumps(versions, indent=2) + "\n")

          with open("$GITHUB_OUTPUT", "a") as output:
              output.write(f"version={next_version}\n")
          PY

      - name: Commit version and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json versions.json
          git commit -m "chore: release ${VERSION}"
          git push origin HEAD:main
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Package plugin files
        run: zip -j constellation-3d.zip main.js manifest.json styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            constellation-3d.zip main.js manifest.json styles.css \
            --title "Constellation 3D ${VERSION}" \
            --notes "Automated release for the latest push to main. Download constellation-3d.zip and follow the installation guide: https://loopman90.github.io/constellation-3d/"
